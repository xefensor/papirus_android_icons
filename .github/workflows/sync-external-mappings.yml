name: Sync External Mappings

on:
  workflow_dispatch:
  push:
    branches:
      - agent/desktop-sync-foundation

permissions:
  contents: write

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Run external mapping import'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Import unambiguous mappings
        run: python3 scripts/sync_external_mappings.py --write

      - name: Show mapping diff summary
        run: |
          git diff --stat -- data.json
          git diff --numstat -- data.json

      - name: Commit updated mappings
        run: |
          if git diff --quiet -- data.json; then
            echo "No new mappings to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Sync external Android mappings"
          git push
