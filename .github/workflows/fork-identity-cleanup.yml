name: One-shot fork identity cleanup

on:
  push:
    branches: [ agent/device-missing-artwork ]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/device-missing-artwork

      - name: Replace abandoned fork endpoints
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/res/values/dashboard_configurations.xml')
          text = p.read_text()

          replacements = {
              'Your donations will help in the development of the application and accelerate the creation of new icons.': 'This maintained community fork keeps Papirus artwork and Android component mappings current.',
              '<string name="share_link">https://www.pling.com/p/1662847</string>': '<string name="share_link">https://github.com/xefensor/papirus_android_icons</string>',
              '<bool name="enable_icon_request">true</bool>': '<bool name="enable_icon_request">false</bool>',
              '<string name="regular_request_email">varlesh@yandex.ru</string>': '<string name="regular_request_email"></string>',
              '<string name="premium_request_email">varlesh@yandex.ru</string>': '<string name="premium_request_email"></string>',
              '<string name="wallpaper_json">https://raw.githubusercontent.com/PapirusDevelopmentTeam/papirus_icons/master/walls/walls.json</string>': '<string name="wallpaper_json">https://raw.githubusercontent.com/xefensor/papirus_android_icons/master/walls/walls.json</string>',
              '<string name="about_profile_image">profile_picture</string>': '<string name="about_profile_image">ic_splash_screen</string>',
              '<string name="about_title">Papirus Development Team</string>': '<string name="about_title">Papirus Android</string>',
              'Popular Linux icon theme now on Android!': 'Papirus for Android, maintained as a community fork with full credit to the original Papirus Development Team and contributors.',
              '<item>varlesh@gmail.com</item>\n        <item>https://github.com/PapirusDevelopmentTeam/papirus_icons</item>': '<item>https://github.com/xefensor/papirus_android_icons</item>\n        <item>https://github.com/PapirusDevelopmentTeam/papirus-icon-theme</item>',
              '<bool name="enable_donation">true</bool>': '<bool name="enable_donation">false</bool>',
              '<string name="config_json">https://raw.githubusercontent.com/PapirusDevelopmentTeam/papirus_icons/master/update.json</string>': '<string name="config_json">https://raw.githubusercontent.com/xefensor/papirus_android_icons/master/update.json</string>',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected text not found: {old}')
              text = text.replace(old, new)

          p.write_text(text)
          PY

      - name: Verify stale maintainer endpoints are gone
        run: |
          ! grep -R -n -E 'varlesh@(yandex\.ru|gmail\.com)|www\.pling\.com/p/1662847|miraficus/papirus_android_icons/releases|raw\.githubusercontent\.com/PapirusDevelopmentTeam/papirus_icons/master/update\.json' \
            README.md update.json app/src/main/res/values/dashboard_configurations.xml app/build.gradle

      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo 'No cleanup changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/res/values/dashboard_configurations.xml
          git commit -m 'Remove stale maintainer endpoints'
          git push origin HEAD:agent/device-missing-artwork
