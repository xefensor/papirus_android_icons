name: Build APK

on:
  push:
    branches:
      - master
      - 'agent/**'
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Validate maintenance scripts
      run: python3 -m py_compile scripts/*.py

    - name: Test external mapping sync
      run: python3 scripts/sync_external_mappings.py

    - name: Apply external mappings
      if: github.event_name == 'push' && github.event.head_commit.message == 'Run external mapping import'
      run: |
        python3 scripts/sync_external_mappings.py --write
        git diff --stat -- data.json
        git diff --numstat -- data.json

        if git diff --quiet -- data.json; then
          echo "No new mappings to commit."
        else
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Sync external Android mappings"
          git push
        fi

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build APK
      run: ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: app/build/outputs/apk/release/app-release.apk
