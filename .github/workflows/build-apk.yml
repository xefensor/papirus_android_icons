name: Build APK

on:
  push:
    branches:
      - master
      - 'agent/**'
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Validate maintenance scripts
      run: python3 -m py_compile scripts/*.py

    - name: Apply clean ordered mapping import
      if: github.event_name == 'push' && github.event.head_commit.message == 'Run ordered mapping import'
      run: |
        python3 scripts/sync_external_mappings.py --write
        DB_FILE=./data.json APPFILTER_FILE=./app/src/main/assets/appfilter.xml \
          python3 scripts/generate_appfilter.py
        git diff --stat -- data.json external-mappings.json app/src/main/assets/appfilter.xml
        git diff --numstat -- data.json external-mappings.json app/src/main/assets/appfilter.xml
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add data.json external-mappings.json app/src/main/assets/appfilter.xml
        git commit -m "Sync external Android mappings"
        git push

    - name: Validate external mapping sync is idempotent
      if: github.event.head_commit.message != 'Run ordered mapping import'
      run: |
        cp data.json /tmp/papirus-data.json
        cp external-mappings.json /tmp/papirus-external-mappings.json
        python3 scripts/sync_external_mappings.py \
          --db /tmp/papirus-data.json \
          --provenance /tmp/papirus-external-mappings.json \
          --write
        cmp data.json /tmp/papirus-data.json
        cmp external-mappings.json /tmp/papirus-external-mappings.json

    - name: Validate tracked appfilter
      if: github.event.head_commit.message != 'Run ordered mapping import'
      run: |
        DB_FILE=./data.json APPFILTER_FILE=/tmp/papirus-appfilter.xml \
          python3 scripts/generate_appfilter.py
        cmp app/src/main/assets/appfilter.xml /tmp/papirus-appfilter.xml

    - name: Generate appfilter resource
      run: |
        DB_FILE=./data.json APPFILTER_FILE=./app/src/main/res/xml/appfilter.xml \
          python3 scripts/generate_appfilter.py

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build APK
      run: ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: app/build/outputs/apk/release/*.apk
