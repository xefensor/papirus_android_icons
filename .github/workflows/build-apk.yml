name: Build APK

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artwork-audit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Validate maintenance scripts
      run: python3 -m py_compile scripts/*.py

    - name: Check desktop Papirus Android candidates
      run: |
        git clone --depth 1 --filter=blob:none --sparse \
          https://github.com/PapirusDevelopmentTeam/papirus-icon-theme.git /tmp/papirus-icon-theme
        git -C /tmp/papirus-icon-theme sparse-checkout set Papirus/64x64/apps
        python3 scripts/sync_android_artwork.py /tmp/papirus-icon-theme --list

  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Validate maintenance scripts
      run: python3 -m py_compile scripts/*.py

    - name: Validate external mapping sync is idempotent
      run: |
        cp data.json /tmp/papirus-data.json
        cp external-mappings.json /tmp/papirus-external-mappings.json
        python3 scripts/sync_external_mappings.py \
          --db /tmp/papirus-data.json \
          --provenance /tmp/papirus-external-mappings.json \
          --write
        cmp data.json /tmp/papirus-data.json
        cmp external-mappings.json /tmp/papirus-external-mappings.json

    - name: Validate tracked appfilter
      run: |
        DB_FILE=./data.json APPFILTER_FILE=/tmp/papirus-appfilter.xml \
          python3 scripts/generate_appfilter.py
        cmp app/src/main/assets/appfilter.xml /tmp/papirus-appfilter.xml

    - name: Install SVG renderer
      run: |
        if ! command -v inkscape >/dev/null; then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends inkscape
        fi

    - name: Generate icon pack resources
      run: make VALIDATE=false build

    - name: Apply user test mapping aliases
      run: |
        python3 - <<'PY'
        from pathlib import Path

        path = Path('app/src/main/res/xml/appfilter.xml')
        text = path.read_text()
        aliases = [
            ('cz.nic.mobiledatovka/org.qtproject.qt.android.bindings.QtActivity', 'apps_datovka'),
            ('org.mozilla.fennec_fdroid/org.mozilla.fennec_fdroid.AppRetro2004', 'apps_fennec'),
            ('com.fitbit.FitbitMobile/com.fitbit.HealthBrandedAlias', 'apps_fitbit'),
            ('org.kde.kdeconnect_tp/org.kde.kdeconnect.ui.MainActivity', 'apps_kdeconnect'),
            ('de.blinkt.openvpn/de.blinkt.openvpn.activities.MainActivity', 'apps_openvpn'),
            ('com.github.muellerma.coffee/com.github.muellerma.coffee.activities.MainActivity', 'apps_caffeine'),
            ('com.google.android.apps.tips/com.google.android.apps.tips.fortnite.p8', 'google_pixel_tipps'),
            ('de.ph1b.audiobook/voice.app.features.MainActivity', 'apps_voice_audiobook_player'),
        ]
        additions = []
        for component, drawable in aliases:
            if component not in text:
                additions.append(f'\t<item component="ComponentInfo{{{component}}}" drawable="{drawable}"/>')
        if additions:
            text = text.replace('</resources>', '\n'.join(additions) + '\n</resources>')
            path.write_text(text)
        print(f'Added {len(additions)} user-test mapping aliases')
        for line in additions:
            print(line)
        PY

    - name: Verify generated icon bitmaps
      run: |
        svg_count=$(find src -maxdepth 1 -name '*.svg' | wc -l)
        png_count=$(find app/src/main/res/drawable-nodpi -maxdepth 1 -name '*.png' ! -name 'ic_splash_screen.png' | wc -l)
        echo "SVG icons: $svg_count"
        echo "Generated PNG icons: $png_count"
        test "$svg_count" -eq "$png_count"

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build release and installable test APKs
      run: ./gradlew assembleRelease assembleDebug

    - name: Upload release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: app/build/outputs/apk/release/*.apk

    - name: Upload installable test APK
      uses: actions/upload-artifact@v4
      with:
        name: app-test-apk
        path: app/build/outputs/apk/debug/*.apk
