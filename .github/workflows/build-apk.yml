name: Build APK

on:
  push:
    branches:
      - master
      - 'agent/**'
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Validate maintenance scripts
      run: python3 -m py_compile scripts/*.py

    - name: Test external mapping sync
      run: python3 scripts/sync_external_mappings.py

    - name: Apply external mappings
      if: github.event_name == 'push' && github.event.head_commit.message == 'Run external mapping import'
      run: |
        python3 scripts/sync_external_mappings.py --write
        DB_FILE=./data.json APPFILTER_FILE=./app/src/main/assets/appfilter.xml \
          python3 scripts/generate_appfilter.py

        python3 - <<'PY'
        import collections, json
        data = json.load(open('external-mappings.json', encoding='utf-8'))['components']
        counts = collections.Counter(entry['drawable'] for entry in data.values())
        print(f"Tracked external mappings: {len(data)}")
        print("Largest imported mapping sets:")
        for drawable, count in counts.most_common(20):
            print(f"  {drawable}: {count}")
        PY

        git diff --stat -- data.json external-mappings.json app/src/main/assets/appfilter.xml
        git diff --numstat -- data.json external-mappings.json app/src/main/assets/appfilter.xml

        if git diff --quiet -- data.json external-mappings.json app/src/main/assets/appfilter.xml; then
          echo "No new mappings to commit."
        else
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json external-mappings.json app/src/main/assets/appfilter.xml
          git commit -m "Sync external Android mappings"
          git push
        fi

    - name: Generate appfilter resource
      run: |
        mkdir -p app/src/main/res/xml
        DB_FILE=./data.json APPFILTER_FILE=./app/src/main/res/xml/appfilter.xml \
          python3 scripts/generate_appfilter.py

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build APK
      run: ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: app/build/outputs/apk/release/app-release.apk
