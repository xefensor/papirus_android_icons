name: Build APK

on:
  push:
    branches:
      - master
      - agent/android-artwork-coverage
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  artwork-import:
    if: github.event_name == 'push' && github.ref_name == 'agent/android-artwork-coverage' && github.event.head_commit.message == 'Run verified artwork import'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout branch
      uses: actions/checkout@v5
      with:
        ref: agent/android-artwork-coverage

    - name: Clone desktop Papirus
      run: |
        git clone --depth 1 --filter=blob:none --sparse \
          https://github.com/PapirusDevelopmentTeam/papirus-icon-theme.git /tmp/papirus-icon-theme
        git -C /tmp/papirus-icon-theme sparse-checkout set Papirus/64x64/apps

    - name: Import verified artwork
      run: |
        upstream_ref=$(git -C /tmp/papirus-icon-theme rev-parse HEAD)
        python3 scripts/sync_android_artwork.py /tmp/papirus-icon-theme \
          --write \
          --upstream-ref "$upstream_ref"
        DB_FILE=./data.json APPFILTER_FILE=./app/src/main/assets/appfilter.xml \
          python3 scripts/generate_appfilter.py

        git diff --stat -- data.json external-mappings.json desktop-sync.json \
          app/src/main/assets/appfilter.xml src

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add data.json external-mappings.json desktop-sync.json \
          app/src/main/assets/appfilter.xml src/*.svg
        git commit -m "Import verified desktop Papirus artwork"
        git push

  artwork-audit:
    if: github.event_name != 'push' || github.ref_name == 'master'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Validate maintenance scripts
      run: python3 -m py_compile scripts/*.py

    - name: Check desktop Papirus Android candidates
      run: |
        git clone --depth 1 --filter=blob:none --sparse \
          https://github.com/PapirusDevelopmentTeam/papirus-icon-theme.git /tmp/papirus-icon-theme
        git -C /tmp/papirus-icon-theme sparse-checkout set Papirus/64x64/apps
        python3 scripts/sync_android_artwork.py /tmp/papirus-icon-theme --list

  build:
    if: github.event_name != 'push' || github.ref_name == 'master'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Validate maintenance scripts
      run: python3 -m py_compile scripts/*.py

    - name: Validate external mapping sync is idempotent
      run: |
        cp data.json /tmp/papirus-data.json
        cp external-mappings.json /tmp/papirus-external-mappings.json
        python3 scripts/sync_external_mappings.py \
          --db /tmp/papirus-data.json \
          --provenance /tmp/papirus-external-mappings.json \
          --write
        cmp data.json /tmp/papirus-data.json
        cmp external-mappings.json /tmp/papirus-external-mappings.json

    - name: Validate tracked appfilter
      run: |
        DB_FILE=./data.json APPFILTER_FILE=/tmp/papirus-appfilter.xml \
          python3 scripts/generate_appfilter.py
        cmp app/src/main/assets/appfilter.xml /tmp/papirus-appfilter.xml

    - name: Install SVG renderer
      run: |
        if ! command -v inkscape >/dev/null; then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends inkscape
        fi

    - name: Generate icon pack resources
      run: make VALIDATE=false build

    - name: Verify generated icon bitmaps
      run: |
        svg_count=$(find src -maxdepth 1 -name '*.svg' | wc -l)
        png_count=$(find app/src/main/res/drawable-nodpi -maxdepth 1 -name '*.png' ! -name 'ic_splash_screen.png' | wc -l)
        echo "SVG icons: $svg_count"
        echo "Generated PNG icons: $png_count"
        test "$svg_count" -eq "$png_count"

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build APK
      run: ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: app/build/outputs/apk/release/*.apk
