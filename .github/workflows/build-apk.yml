name: Build APK

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  persist-verified-mappings:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout PR branch
      uses: actions/checkout@v5
      with:
        ref: ${{ github.event.pull_request.head.ref }}

    - name: Persist verified device mappings
      run: |
        python3 - <<'PY'
        import json
        from pathlib import Path

        aliases = {
            'apps_datovka': 'cz.nic.mobiledatovka/org.qtproject.qt.android.bindings.QtActivity',
            'apps_fennec': 'org.mozilla.fennec_fdroid/org.mozilla.fennec_fdroid.AppRetro2004',
            'apps_fitbit': 'com.fitbit.FitbitMobile/com.fitbit.HealthBrandedAlias',
            'apps_kdeconnect': 'org.kde.kdeconnect_tp/org.kde.kdeconnect.ui.MainActivity',
            'apps_openvpn': 'de.blinkt.openvpn/de.blinkt.openvpn.activities.MainActivity',
            'apps_caffeine': 'com.github.muellerma.coffee/com.github.muellerma.coffee.activities.MainActivity',
            'google_pixel_tipps': 'com.google.android.apps.tips/com.google.android.apps.tips.fortnite.p8',
            'apps_voice_audiobook_player': 'de.ph1b.audiobook/voice.app.features.MainActivity',
        }

        path = Path('data.json')
        db = json.loads(path.read_text())
        changed = []
        for drawable, component in aliases.items():
            if drawable not in db:
                raise SystemExit(f'Missing expected drawable key: {drawable}')
            if component not in db[drawable]:
                db[drawable].append(component)
                changed.append((drawable, component))
        if changed:
            path.write_text(json.dumps(db, indent=2, ensure_ascii=False) + '\n')
        print(f'Persisted {len(changed)} verified mappings')
        for drawable, component in changed:
            print(f'{drawable}: {component}')
        PY
        DB_FILE=./data.json APPFILTER_FILE=app/src/main/assets/appfilter.xml \
          python3 scripts/generate_appfilter.py

    - name: Commit verified mappings
      run: |
        if git diff --quiet -- data.json app/src/main/assets/appfilter.xml; then
          echo 'Mappings already persisted; nothing to commit.'
          exit 0
        fi
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add data.json app/src/main/assets/appfilter.xml
        git commit -m 'Add verified device component mappings'
        git push origin HEAD:${{ github.event.pull_request.head.ref }}

  artwork-audit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Validate maintenance scripts
      run: python3 -m py_compile scripts/*.py

    - name: Check desktop Papirus Android candidates
      run: |
        git clone --depth 1 --filter=blob:none --sparse \
          https://github.com/PapirusDevelopmentTeam/papirus-icon-theme.git /tmp/papirus-icon-theme
        git -C /tmp/papirus-icon-theme sparse-checkout set Papirus/64x64/apps
        python3 scripts/sync_android_artwork.py /tmp/papirus-icon-theme --list

  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Validate maintenance scripts
      run: python3 -m py_compile scripts/*.py

    - name: Validate external mapping sync is idempotent
      run: |
        cp data.json /tmp/papirus-data.json
        cp external-mappings.json /tmp/papirus-external-mappings.json
        python3 scripts/sync_external_mappings.py \
          --db /tmp/papirus-data.json \
          --provenance /tmp/papirus-external-mappings.json \
          --write
        cmp data.json /tmp/papirus-data.json
        cmp external-mappings.json /tmp/papirus-external-mappings.json

    - name: Validate tracked appfilter
      run: |
        DB_FILE=./data.json APPFILTER_FILE=/tmp/papirus-appfilter.xml \
          python3 scripts/generate_appfilter.py
        cmp app/src/main/assets/appfilter.xml /tmp/papirus-appfilter.xml

    - name: Install SVG renderer
      run: |
        if ! command -v inkscape >/dev/null; then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends inkscape
        fi

    - name: Generate icon pack resources
      run: make VALIDATE=false build

    - name: Verify generated icon bitmaps
      run: |
        svg_count=$(find src -maxdepth 1 -name '*.svg' | wc -l)
        png_count=$(find app/src/main/res/drawable-nodpi -maxdepth 1 -name '*.png' ! -name 'ic_splash_screen.png' | wc -l)
        echo "SVG icons: $svg_count"
        echo "Generated PNG icons: $png_count"
        test "$svg_count" -eq "$png_count"

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build release and installable test APKs
      run: ./gradlew assembleRelease assembleDebug

    - name: Upload release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: app/build/outputs/apk/release/*.apk

    - name: Upload installable test APK
      uses: actions/upload-artifact@v4
      with:
        name: app-test-apk
        path: app/build/outputs/apk/debug/*.apk
