apply plugin: 'com.android.application'

android {
    compileSdk rootProject.ext.CompileSdk

    defaultConfig {
        // Keep the inherited Java namespace below for now, but give the maintained
        // fork its own install identity so it can coexist with older Papirus builds.
        applicationId "io.github.xefensor.papirus_icons"
        minSdkVersion rootProject.ext.MinSdk
        targetSdkVersion rootProject.ext.TargetSdk
        versionCode 11
        versionName "20260811"
    }

    bundle {
        language {
            enableSplit false
        }
    }
    
    buildTypes {
        debug {
            applicationIdSuffix ".test"
            versionNameSuffix "-test"
        }
        release {
            debuggable false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // Keep the original namespace to avoid needless source-package churn. This is
    // internal implementation detail; applicationId above is the public app ID.
    namespace 'io.github.PapirusDevelopmentTeam.papirus_icons'

    lint {
        abortOnError false
    }
}

base {
    archivesName = "${parent.name}-${android.defaultConfig.versionCode}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(11)
    }
}

dependencies {
    implementation 'com.github.Donnnno:candybar-foss:3.21.3'
}

// Code for automatically copying appfilter.xml and drawable.xml
// from `res/xml` directory to `assets` directory
tasks.register('copyXMLs') {
    ['appfilter.xml', 'drawable.xml'].each { file ->
        copy {
            from "$projectDir/src/main/res/xml/$file"
            into "$projectDir/src/main/assets/"
        }
    }
}

tasks.whenTaskAdded { task ->
    if (task.name == 'assembleDebug' || task.name == 'assembleRelease') {
        task.dependsOn copyXMLs
    }
}
